name: _tmp query
on:
  workflow_dispatch:
    inputs:
      arg:
        description: 'Argumento para el script'
        required: false
        default: ''
      arg2:
        description: 'Segundo argumento (opcional)'
        required: false
        default: ''
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install @supabase/supabase-js
      - env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/_tmp-buscar-imei.js "${{ github.event.inputs.arg }}" "${{ github.event.inputs.arg2 }}"

# ─────────────────────────────────────────────────────────────────────────────
# GitHub Action: sync periódico de pórticos/TAG para la prueba interna KCERDA
# (Suzuki Nomade DFFD-69, unitId TrackGTS 3571).
#
# Mismo motivo que el de Santa Marta: no puede correr en Vercel porque necesita
# un login real de TrackGTS vía Puppeteer, no el token simple de /api/sync.
#
# Programado a los minutos 10/30/50 (offset de los otros dos crons de esta
# cuenta: /api/sync en Vercel corre en 0/20/40, y el sync de Santa Marta en
# 5/25/45) para no loguearse en TrackGTS al mismo tiempo con la misma cuenta —
# la cuenta tiene un límite real de solicitudes entre logins.
# ─────────────────────────────────────────────────────────────────────────────

name: Sync Pórticos Pórticos

on:
  schedule:
    - cron: '13,43,50 * * * *'

  workflow_dispatch:

jobs:
  sync-porticos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install puppeteer @supabase/supabase-js
        timeout-minutes: 5

      - name: Sync pórticos
        env:
          TL_USER: ${{ secrets.TL_USER }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_DOMAIN: ${{ secrets.TL_DOMAIN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/sync-porticos.js

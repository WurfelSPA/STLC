# ─────────────────────────────────────────────────────────────────────────────
# GitHub Action: Historial completo (odómetro + horómetro por punto) para
# Santa Marta
#
# Pedido explícito del cliente (2026-08-24): con el sync anterior
# (reportUnitsAndLastPosition, "último estado conocido") solo recibían
# <3% de los ~1.400 registros/día que la plataforma realmente guarda.
# Este script pide, vía reportTravel, TODO lo ocurrido desde la última
# corrida exitosa (no solo el último dato) y lo acumula en la tabla
# SantaMartaHistorial — así no hace falta subir la frecuencia de sync
# para dejar de perder información entre una corrida y la siguiente.
#
# No puede correr en Vercel porque necesita un navegador (Puppeteer) real
# para loguearse — TrackGTS exige una sesión de login real para este
# endpoint, no el token simple que usa /api/sync.
#
# Programado 5 minutos después de cada corrida de /api/sync (que cae en
# :00/:20/:40 UTC) para no loguearse en TrackGTS al mismo tiempo con la
# misma cuenta — la cuenta tiene un límite de solicitudes real (confirmado
# 2026-08-18: bloqueo de ~12 min tras un par de logins seguidos; confirmado
# 2026-08-20: ya solo ~4 min, GTS parece haber acortado el enfriamiento).
# ─────────────────────────────────────────────────────────────────────────────

name: Sync Historial Santa Marta

on:
  schedule:
    - cron: '5,25,45 * * * *'

  workflow_dispatch:

jobs:
  sync-historial:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install puppeteer @supabase/supabase-js
        timeout-minutes: 5

      - name: Sync historial de Santa Marta
        env:
          TL_USER: ${{ secrets.TL_USER }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_DOMAIN: ${{ secrets.TL_DOMAIN }}
        run: node scripts/sync-historial-santamarta.js

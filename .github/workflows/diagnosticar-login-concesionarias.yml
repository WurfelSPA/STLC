# ─────────────────────────────────────────────────────────────────────────────
# GitHub Action: diagnóstico puntual, no toca producción -- corre los 2
# scripts de diagnóstico de login (Vespucio Sur / Autopase) y sube las
# capturas de pantalla + HTML como artifact para revisarlos, antes de
# construir el scraper completo que va a alimentar la tabla de "datos
# reales" para comparar contra la detección automática (pedido 2026-10-05).
# ─────────────────────────────────────────────────────────────────────────────

name: Diagnosticar login concesionarias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cachear node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: node-modules-tlchile-v2

      - name: Instalar dependencias
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install puppeteer
        timeout-minutes: 5

      - name: Diagnosticar login Vespucio Sur
        if: always()
        env:
          VESPUCIO_SUR_RUT: ${{ secrets.VESPUCIO_SUR_RUT }}
          VESPUCIO_SUR_PASSWORD: ${{ secrets.VESPUCIO_SUR_PASSWORD }}
        run: node scripts/diagnosticar-login-vespuciosur.js

      - name: Diagnosticar login Costanera Norte
        if: always()
        env:
          COSTANERA_NORTE_RUT: ${{ secrets.COSTANERA_NORTE_RUT }}
          COSTANERA_NORTE_PASSWORD: ${{ secrets.COSTANERA_NORTE_PASSWORD }}
        run: node scripts/diagnosticar-login-costaneranorte.js

      - name: Diagnosticar login Autopase
        if: always()
        env:
          AUTOPASE_RUT: ${{ secrets.AUTOPASE_RUT }}
          AUTOPASE_PASSWORD: ${{ secrets.AUTOPASE_PASSWORD }}
        run: node scripts/diagnosticar-login-autopase.js

      - name: Subir capturas y HTML como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-login-concesionarias
          path: |
            *.png
            *.html
          retention-days: 7

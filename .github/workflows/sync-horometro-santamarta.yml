# ─────────────────────────────────────────────────────────────────────────────
# GitHub Action: Odómetro decimal para Santa Marta
#
# Complementa /api/sync (que corre en Vercel cada 25 min vía cron nativo)
# con el odómetro sin redondear, que HealthCheck no expone. No puede
# correr en Vercel porque necesita un navegador (Puppeteer) real para
# loguearse — TrackGTS exige una sesión de login real para el endpoint
# que trae este dato, no el token simple que usa /api/sync.
#
# NOTA 2026-08-20: el horómetro se sacó de este script — GTS lo agregó
# directo al HealthCheck, así que ahora /api/sync lo trae para toda la
# flota sin necesitar Puppeteer (ver comentario en app/api/sync/route.ts).
#
# Programado 5 minutos después de cada corrida de /api/sync (que cae en
# :00/:20/:40 UTC) para no loguearse en TrackGTS al mismo tiempo con la
# misma cuenta — la cuenta tiene un límite de solicitudes real (confirmado
# 2026-08-18: bloqueo de ~12 min tras un par de logins seguidos; confirmado
# 2026-08-20: ya solo ~4 min, GTS parece haber acortado el enfriamiento).
# ─────────────────────────────────────────────────────────────────────────────

name: Sync Odómetro Decimal Santa Marta

on:
  schedule:
    - cron: '5,25,45 * * * *'

  workflow_dispatch:

jobs:
  sync-horometro:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install puppeteer @supabase/supabase-js
        timeout-minutes: 5

      - name: Sync odómetro decimal
        env:
          TL_USER: ${{ secrets.TL_USER }}
          TL_PASSWORD: ${{ secrets.TL_PASSWORD }}
          TL_DOMAIN: ${{ secrets.TL_DOMAIN }}
        run: node scripts/sync-horometro-santamarta.js
